name: Secret scan

# The repository ships no credential file: every key lives in the environment
# (see .env.example). This job keeps it that way by scanning every commit and
# pull request for credentials that slipped into the tree.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a leaked key stays in the log even after it is
          # removed from the tip.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed by organizations that use the commercial license.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
