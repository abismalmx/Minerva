name: Build Multiplatform Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            args: ''
          - os: ubuntu-latest
            platform: android
            target: aarch64-linux-android
            args: '-t aarch64 --apk'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Android only)
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (Android only)
        if: matrix.platform == 'android'
        run: sdkmanager "ndk;28.2.13676358"

      - name: Install Linux dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup vendor assets
        run: pnpm --filter @minerva/app setup-vendors

      - name: Build Android APK
        if: matrix.platform == 'android'
        run: |
          cd apps/minerva-app
          export ANDROID_HOME=$ANDROID_HOME
          export NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          pnpm tauri android build ${{ matrix.args }}

      - name: Build Desktop (Windows, macOS, Linux)
        if: matrix.platform != 'android'
        run: |
          cd apps/minerva-app
          pnpm tauri build ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minerva-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            apps/minerva-app/src-tauri/target/**/bundle/**/*.exe
            apps/minerva-app/src-tauri/target/**/bundle/**/*.msi
            apps/minerva-app/src-tauri/target/**/bundle/**/*.dmg
            apps/minerva-app/src-tauri/target/**/bundle/**/*.app
            apps/minerva-app/src-tauri/target/**/bundle/**/*.AppImage
            apps/minerva-app/src-tauri/target/**/bundle/**/*.deb
            apps/minerva-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.exe
            **/*.msi
            **/*.dmg
            **/*.AppImage
            **/*.deb
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
